# SPDX-License-Identifier: Apache-2.0

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

CONFIG_FINCH_CSP=y
CONFIG_FINCH_CSP_NODE_ADDRESS=1
CONFIG_FINCH_CSP_HOSTNAME="obc"

# libcsp features required by the CSP-over-CAN + routing path.
CONFIG_CSP_USE_RTABLE=y
CONFIG_CSP_HAVE_CAN=y

# libcsp's Zephyr CAN driver allocates its context with k_calloc(),
# so a non-zero system heap is required.
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_CAN=y
CONFIG_SPI=y

# Configure UART as logging backend
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_FLASH=y
CONFIG_SPI=y
