# SPDX-License-Identifier: Apache-2.0

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
CONFIG_FINCH_CSP=y
CONFIG_FINCH_CSP_NODE_ADDRESS=2
CONFIG_FINCH_CSP_HOSTNAME="pay"

# Configure UART as logging backend
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y


# Enable Disk Access and SDMMC Drivers
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# Enable File System support (if you intend to use FATFS/LittleFS)
CONFIG_FILE_SYSTEM=y


# Enable the Secure Digital Host Controller (SDHC) core and logging
CONFIG_SDHC=y
CONFIG_SDHC_LOG_LEVEL_INF=y

# Core Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MPU_LOG_LEVEL_OFF=y
CONFIG_SDMMC_LOG_LEVEL_DBG=y
CONFIG_DISK_LOG_LEVEL_DBG=y

# Disk Access and SDMMC
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y

# File System and FAT
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Memory allocations (FatFs requires adequate stack/heap)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
